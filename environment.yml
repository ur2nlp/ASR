name: asr
channels:
  - conda-forge
dependencies:
  - python=3.11.*
  - datasets=3.*
  - evaluate
  - hydra-core=1.*
  - jiwer
  - librosa
  # Required, not precautionary: pyctcdecode declares `numpy<2.0.0` in every
  # release it has ever published, 0.0.1 through the current 0.5.0, so this cap
  # cannot be lifted while CTC beam-search decoding is a dependency. Attempting
  # it gives pip ResolutionImpossible, not a runtime surprise.
  #
  # plotnine was the reason once recorded here; that reason is dead (0.15.x
  # declares numpy>=1.23.5 with no ceiling and renders identically under numpy
  # 2.4). Everything else in this file resolves against numpy 2 -- librosa
  # 0.11, soundfile 0.14, jiwer 4.0, evaluate 0.4.6, numba 0.67, transformers.
  # pyctcdecode is the sole blocker, verified by pip resolution 2026-09-22.
  - numpy<2.0
  - plotnine
  - pyctcdecode
  - pytest
  - pyyaml
  - sentencepiece=0.*
  - tokenizers=0.*
  - protobuf
  # Capped below 5 because HuggingFace has repeatedly shipped breaking changes
  # in minor releases; an unbounded requirement would silently rot for anyone
  # forking this template, and that breakage is not hardware-specific. The
  # floor is the oldest release this fork is known to work with, not a verified
  # minimum. Project branches pin an exact version; see cluster-pins.txt.
  - transformers>=4.40,<5
  - tqdm
  - pip
  - pip:
    # The artifact-caching base layer, shared with the LAPT repository rather
    # than hand-copied into src/artifact_configs.py as it used to be. Depending
    # on lapt-core rather than lapt is deliberate: `lapt` would drag in torch,
    # hydra, sacrebleu and deepfocus that nothing here calls, and LAPT's own
    # project branches pin exact versions (gothic pins transformers 4.57.1)
    # that this fork has no reason to inherit. lapt-core pins nothing but
    # PyYAML.
    # Pin a tag, never a branch -- the cache paths this package produces have to
    # be reproducible.
    #
    # A release tarball rather than a git URL, because pip needs the `git`
    # binary to clone one and a compute node is not guaranteed to have it
    # (BlueHive3 compute nodes do not, without `module load git`). The tarball
    # is fetched over plain HTTPS and installs identically. If this repository
    # ever goes private, swap back to:
    #   lapt-core[datasets] @ git+https://github.com/ur2nlp/LAPT.git@lapt-core-v0.1.2#subdirectory=packages/lapt-core
    - lapt-core[datasets] @ https://github.com/ur2nlp/LAPT/archive/refs/tags/lapt-core-v0.1.2.tar.gz#subdirectory=packages/lapt-core
    # Floor of 2.6 is a genuine requirement, not a convenience bump:
    # transformers' `check_torch_load_is_safe` raises outright below it, over
    # CVE-2025-32434 in `torch.load`. It applies when loading `.bin`
    # checkpoints; safetensors is exempt. No upper bound -- the CUDA build is
    # the installing site's concern, not this template's.
    - torch>=2.6
    # Deliberately unpinned, and NOT assumed to track torch: torchaudio 2.11.0
    # and torch 2.14.0 coexist in a working environment, so the version numbers
    # are decoupled and pinning torch does not constrain this transitively.
    - torchaudio
    # Installed through pip rather than conda on purpose. conda-forge's
    # `accelerate` hard-requires `pytorch>=2.0.0`, so listing it as a conda
    # dependency pulls a conda `pytorch` + `libtorch` pair -- a CPU build --
    # which pip then displaces when it installs torch above, leaving ~225 MB
    # of orphaned CPU `libtorch` libraries behind (measured in the existing
    # `asr` environment) and, on a GPU node, a CPU libtorch on the library
    # path beside pip torch's own bundled copy. `accelerate` is the only
    # conda dependency that pulls pytorch; transformers and datasets do not.
    - accelerate>=0.26
    - kenlm
    - soundfile
    - deepfocus
