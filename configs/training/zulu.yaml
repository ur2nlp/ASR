name: zulu

num_train_epochs: 100  # ceiling; training is controlled by max_steps
max_steps: 20000
per_device_train_batch_size: 15
per_device_eval_batch_size: 30
gradient_accumulation_steps: 4
gradient_checkpointing: false
learning_rate: 5e-5
lr_scheduler_type: linear
warmup_ratio: 0.005
max_grad_norm: 1.0

# regularization and masking (override pretrained defaults)
dropout: 0.05
attention_dropout: 0.05
hidden_dropout: 0.05
feat_proj_dropout: 0.05
mask_time_prob: 0.15
mask_feature_prob: 0.15
layerdrop: 0.0
ctc_loss_reduction: mean
ctc_zero_infinity: true
weight_decay: 0.01

logging_steps: ${divide:${training.max_steps},1000}
eval_strategy: steps
eval_steps: ${divide:${training.max_steps},100}
save_strategy: steps
save_steps: ${divide:${training.max_steps},100}
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: wer
greater_is_better: false

bf16: true
optim: adamw_torch_fused
dataloader_num_workers: 4
group_by_length: true

# freezing
freeze_feature_extractor: true
freeze_encoder_layers: 0

early_stopping_patience: 10
early_stopping_delay_ratio: 0.0

unfreeze_step_ratio: null
