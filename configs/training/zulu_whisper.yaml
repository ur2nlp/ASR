name: whisper

num_train_epochs: 100  # ceiling; training is controlled by max_steps
max_steps: 20000
per_device_train_batch_size: 30
per_device_eval_batch_size: 120
gradient_accumulation_steps: 2
gradient_checkpointing: false
learning_rate: 1e-5
lr_scheduler_type: linear
warmup_ratio: 0.1
max_grad_norm: 1.0

# regularization and masking (override pretrained defaults)
dropout: 0.05
attention_dropout: 0.05
activation_dropout: 0.05
encoder_layerdrop: 0.0
decoder_layerdrop: 0.0
mask_time_prob: 0.05
mask_feature_prob: 0.05
weight_decay: 0.01

logging_steps: ${divide:${training.max_steps},400}
eval_strategy: steps
eval_steps: ${divide:${training.max_steps},40}
save_strategy: steps
save_steps: ${divide:${training.max_steps},40}
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: wer
greater_is_better: false

generation_max_length: 225
generation_num_beams: 1

bf16: true
optim: adamw_torch_fused
dataloader_num_workers: 4
group_by_length: false

# freezing
freeze_feature_extractor: false
freeze_encoder: false
freeze_encoder_layers: 0

early_stopping_patience: 10
early_stopping_delay_ratio: 0.0

unfreeze_step_ratio: null
