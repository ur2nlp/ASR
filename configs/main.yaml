defaults:
  - _self_
  - model: xls-r
  - training: l40_basic
  - dataset: ???
  - external_eval: none

seed: 1

# Shared dataset defaults. The selected `dataset/<name>.yaml` config group
# supplies `type`, `id`, and type-specific fields (e.g. `path`), and may
# override any of the values below.
dataset:
  cache_dir: "data/${dataset.id}"
  audio_column: audio
  text_column: transcription
  dev_size: 0.1
  max_audio_length_seconds: 30.0
  # Drop examples whose encoded transcript exceeds this many tokens. Only
  # needed for seq2seq decoders with a hard position limit; set to 448 (or
  # lower) for Whisper, which errors out rather than truncating.
  max_label_length: null

preprocessing:
  lowercase: true
  remove_punctuation: true
  unicode_normalize: NFC
  custom_replacements: {}

audio:
  sampling_rate: 16000
  feature_size: 1
  do_normalize: true
  return_attention_mask: true

lm:
  enabled: false
  arpa_path: null
  alpha: 0.5
  beta: 1.5
  beam_width: 100

output_dir: models
# Optional run identifier. When set, it is appended as a suffix to the
# auto-encoded output path
# (`${output_dir}/${dataset.id}/{model_short}_{training}_{experiment_id}`), so
# repeated runs over the same model/training config (e.g. a hyperparameter sweep)
# do not overwrite each other while keeping the descriptive path.
experiment_id: null
fresh_dataset: false
fresh_processed: false
fresh_model: false
resume_from_checkpoint: null
# When true, and no explicit resume_from_checkpoint is given, auto-resume from the
# latest checkpoint in the output directory. Intended for preempt + re-queue
# cluster workflows so a requeued job continues instead of restarting from step 0.
preempt_resume: false

# Keep Hydra's per-run working directory (logs + resolved-config dump) out of the
# way instead of littering the repo root with dated `outputs/YYYY-MM-DD/` folders.
hydra:
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
