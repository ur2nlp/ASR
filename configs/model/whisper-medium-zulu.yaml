type: whisper
pretrained_name: openai/whisper-medium
short_name: whisper-medium-zu

language: sw

# `transcribe` (same-language output), not `translate` (which would target
# English).
task: transcribe

# Whisper's pretrained config suppresses tokens improbable in its pretraining
# languages. Left at the default for now; `[]` clears the suppression lists and
# is worth trying if Zulu orthography turns out to be penalized -- Zulu uses a
# plain Latin alphabet, so this is less likely to bite than it would for a
# language with unusual diacritics.
suppress_tokens: null
